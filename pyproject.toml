[build-system]
requires = ["setuptools>=77", "torch>=2.14.1"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-extension-proj"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
