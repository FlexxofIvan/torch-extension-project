name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.17.1"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Install CPU PyTorch
        run: |
          python -m pip install "torch>=2.14.1" --index-url https://download.pytorch.org/whl/cpu
          python -c 'import torch; print("torch==" + torch.__version__)' > "$RUNNER_TEMP/torch.txt"

      - name: Build wheel
        # Keep isolated build dependencies on the same CPU torch as the runtime.
        run: |
          python -m pip wheel . --no-deps -w dist \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --build-constraint "$RUNNER_TEMP/torch.txt"

      - name: Install wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/test-venv/bin/python" -m pip install \
            -r "$RUNNER_TEMP/torch.txt" --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/test-venv/bin/python" -m pip install "pytest>=9.1.1" dist/*.whl
          "$RUNNER_TEMP/test-venv/bin/python" -m pip check

      - name: Run pytest outside the source tree
        run: |
          test_dir=$(mktemp -d "$RUNNER_TEMP/fse-tests.XXXXXX")
          cp -r tests "$test_dir/tests"
          cd "$test_dir"
          "$RUNNER_TEMP/test-venv/bin/python" -I -m pytest -v tests/
